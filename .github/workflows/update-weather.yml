name: Update county temperature map

# Repaints assets/weather/county-temp.svg and data/weather.json from the latest
# NOAA RTMA hour.
#
# Unlike the other two updaters this one is NOT stdlib — tools/county-temp-map
# pulls geopandas, rasterio, exactextract and cairosvg, and cairosvg needs
# libcairo from apt. It also downloads a ~80 MB Census county shapefile, which
# is why the tool's work/ cache is restored between runs; RTMA grids themselves
# are re-fetched each time because we always want the newest hour.

on:
  schedule:
    - cron: "35 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-weather
  cancel-in-progress: true

jobs:
  paint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libcairo (cairosvg links against it)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2

      - name: Cache the Census shapefile and RTMA scratch
        uses: actions/cache@v4
        with:
          path: tools/county-temp-map/work
          key: county-temp-work-${{ runner.os }}-v1

      - name: Install the generator
        run: python3 -m pip install --quiet ./tools/county-temp-map

      - name: Repaint the map
        run: python3 scripts/update_weather.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/weather/county-temp.svg data/weather.json
          if git diff --cached --quiet; then
            echo "No change — same RTMA hour as the last run."
            exit 0
          fi
          git commit -m "Repaint the county temperature map [skip ci]"
          git push
