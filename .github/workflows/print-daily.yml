name: Print the daily edition

# The Gothic Times goes to press each morning. update_daily.py is stdlib-only,
# so there is nothing to install — it fetches ~25 feeds, scores and dedupes
# them, and writes one JSON edition into data/daily/.
#
# A failed source never kills the edition; that desk just runs thinner. So a
# green run here does not by itself mean every desk is healthy — check the
# "errors" key in the edition if a section looks empty.

on:
  schedule:
    # 10:10 UTC ≈ 6:10 AM ET in summer, 5:10 in winter. GitHub's scheduler is
    # best-effort and often runs late under load; the edition is date-stamped,
    # not time-stamped, so drift is harmless.
    - cron: "10 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: print-daily
  cancel-in-progress: false

jobs:
  print:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Print the edition
        run: python3 scripts/update_daily.py

      - name: Publish the edition
        run: |
          scripts/publish.sh \
            "Print the edition for $(date -u +%Y-%m-%d) [skip ci]" \
            data/daily daily.xml
