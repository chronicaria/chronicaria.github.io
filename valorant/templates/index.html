<section id="tracker" class="masthead" aria-labelledby="tracker-h">
  <h1 id="tracker-h">$tracker_heading</h1>
  <p class="lede">$mwpa_line</p>
  <div class="figure" data-tracker>
    <p class="fallback">$tracker_fallback</p>
  </div>
</section>

<section id="offdef" aria-labelledby="offdef-h">
  <h2 id="offdef-h">$offdef_heading</h2>
  <div class="figure" data-offdef>
    <p class="fallback">$offdef_fallback</p>
  </div>
</section>

<section id="matches" aria-labelledby="matches-h">
  <h2 id="matches-h">$matches_heading</h2>
  <p class="note">$matches_note</p>
$match_filters
  <div class="scroll" tabindex="0" role="region" aria-label="Every match of the act, newest first" data-index>
$match_table
  </div>
</section>
